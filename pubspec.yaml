name: app_controller
description: A fan cooler controller app.
publish_to: 'none'
version: 2.0.0+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_blue_plus: ^1.32.12
  mqtt_client: ^10.3.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# ===== KONFIGURASI LOGO APLIKASI (ganti ikon default Flutter yg kotak-kotak) =====
# Dijalankan otomatis di CI lewat: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
